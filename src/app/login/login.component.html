<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <form [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-sm">

    <h2 class="text-xl sm:text-2xl font-bold mb-6 text-center text-gray-800">
      Iniciar Sesión
    </h2>

    <!-- Usuario -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="username">
        Usuario
      </label>
      <input
        formControlName="username"
        type="text"
        id="username"
        class="w-full px-4 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        placeholder="Ingresa tu usuario"
        aria-label="Username">
    </div>

    <!-- Contraseña -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" for="password">
        Contraseña
      </label>
      <input
        formControlName="password"
        type="password"
        id="password"
        class="w-full px-4 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        placeholder="Ingresa tu contraseña"
        aria-label="Password">
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage"
         class="text-red-500 text-xs sm:text-sm mb-4 text-center bg-red-50 border border-red-200 rounded-md px-3 py-2">
      {{ errorMessage }}
    </div>

    <!-- Botón -->
    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading"
      class="w-full bg-blue-500 text-white py-2.5 rounded-md hover:bg-blue-600 transition-colors font-medium text-sm disabled:bg-blue-300 disabled:cursor-not-allowed flex items-center justify-center gap-2">
      <svg *ngIf="isLoading"
           class="animate-spin h-4 w-4"
           xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ isLoading ? 'Cargando...' : 'Iniciar sesión' }}</span>
    </button>

  </form>
</div>
