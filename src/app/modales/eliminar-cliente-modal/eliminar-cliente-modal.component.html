<div *ngIf="mostrarModal"
     class="relative z-10"
     aria-labelledby="modal-title"
     role="dialog"
     aria-modal="true">

  <!-- Fondo oscuro -->
  <div class="fixed inset-0 bg-gray-500/75 transition-opacity" aria-hidden="true"></div>

  <!-- Contenedor -->
  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end sm:items-center justify-center p-0 sm:p-4">

      <div class="relative w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-lg shadow-xl transition-all sm:my-8">

        <!-- Cuerpo -->
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 rounded-t-2xl sm:rounded-t-lg">
          <div class="flex items-start gap-4">

            <!-- Ícono -->
            <div class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-red-100">
              <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24"
                   stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
              </svg>
            </div>

            <!-- Texto -->
            <div class="flex-1">
              <h3 class="text-base font-semibold text-gray-900" id="modal-title">
                Eliminar Cliente
              </h3>
              <p class="mt-2 text-sm text-gray-500">
                ¿Estás seguro de que deseas eliminar este cliente? Esta acción no se puede
                deshacer y eliminará todos los registros asociados.
              </p>
            </div>

          </div>
        </div>

        <!-- Footer -->
        <div class="bg-gray-50 px-4 py-3 sm:px-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3 rounded-b-2xl sm:rounded-b-lg">
          <button
            (click)="cerrar()"
            type="button"
            data-cy="cancel-delete"
            class="w-full sm:w-auto inline-flex justify-center rounded-md bg-white px-4 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button
            (click)="eliminar()"
            type="button"
            data-cy="confirm-delete"
            class="w-full sm:w-auto inline-flex justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500 transition-colors">
            Eliminar
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
