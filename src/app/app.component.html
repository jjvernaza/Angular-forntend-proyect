<!-- Con sesión activa -->
<div *ngIf="isAuthenticated; else loginView">

  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Contenido principal -->
  <main class="md:ml-64 min-h-screen bg-gray-100 pt-16 md:pt-0">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Login sin sidebar -->
<ng-template #loginView>
  <div class="w-full min-h-screen">
    <router-outlet></router-outlet>
  </div>
</ng-template>
